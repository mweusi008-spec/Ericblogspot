<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ericblogspot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

{% if emergency_items %}
<div id="emergency-ribbon" class="emergency-ribbon">
    <div class="emergency-ribbon-content">
        <span class="emergency-icon">🚨</span>
        <span class="emergency-text">
            {% for item in emergency_items %}
                {{ item.title }} &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;
            {% endfor %}
        </span>
    </div>
</div>
{% endif %}

<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">

        <a class="navbar-brand fw-bold fs-2" href="/">
            Ericblogspot
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'forex' %}">Forex</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'ai_news' %}">AI News</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cybersecurity' %}">Cybersecurity</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'emergency' %}">Emergency</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container mt-5">

{% block content %}

{% endblock %}

</div>

<footer>
    <div class="container">
        <p class="mb-0">&copy; 2026 Ericblogspot. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function() {
    const interval = 30000;
    let timer = null;

    function updateEmergencyRibbon() {
        fetch("{% url 'emergency_api' %}", {headers: {'X-Requested-With': 'XMLHttpRequest'}})
            .then(r => r.json())
            .then(data => {
                const existing = document.getElementById('emergency-ribbon');
                const items = data.emergency || [];

                if (items.length > 0) {
                    let html = '<div id="emergency-ribbon" class="emergency-ribbon"><div class="emergency-ribbon-content"><span class="emergency-icon">🚨</span><span class="emergency-text">';
                    items.forEach(function(item) {
                        html += item.title + ' &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;';
                    });
                    html += '</span></div></div>';

                    if (existing) {
                        existing.outerHTML = html;
                    } else {
                        document.body.insertAdjacentHTML('afterbegin', html);
                    }
                } else {
                    if (existing) {
                        existing.remove();
                    }
                }
            })
            .catch(() => {});
    }

    function startEmergencyRefresh() {
        timer = setInterval(updateEmergencyRibbon, interval);
    }

    function stopEmergencyRefresh() {
        if (timer) clearInterval(timer);
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopEmergencyRefresh();
        } else {
            updateEmergencyRibbon();
            startEmergencyRefresh();
        }
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startEmergencyRefresh);
    } else {
        startEmergencyRefresh();
    }
})();
</script>

</body>
</html>
