databases:
  - name: ericblogspot-db
    plan: free

services:
  - type: web
    name: ericblogspot
    plan: free
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --log-file -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ericblogspot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
